<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#05050a"/>
<meta name="description" content="Kamal Diamond Reseller — Buy IMO Diamonds 24/7. Fast, Secure, Genuine."/>
<title>Kamal Diamond Reseller — 24/7 Fast Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════ */
:root {
  --gold:#d4a742; --gold-lt:#f5d98b; --gold-dk:#9a7320;
  --glow:rgba(212,167,66,.35);
  --bg:#05050a; --bg2:#0c0c16; --bg3:#111120;
  --glass:rgba(14,14,26,.72); --glass2:rgba(20,20,36,.82);
  --c-border:rgba(212,167,66,.22); --c-dim:rgba(212,167,66,.09);
  --text:#ede8dc; --muted:#706860;
  --blue:#1a6cf8; --blue-dk:#1255d0;
  --green:#22c55e; --red:#ef4444;
  --r:14px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent }
body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg); color:var(--text);
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
button,input,select,textarea { font-family:'DM Sans',sans-serif }
button { cursor:pointer; border:none; background:none }
a { color:inherit; text-decoration:none }

/* ═══════════════════════════════════════════════
   ANIMATED STARFIELD BACKGROUND
═══════════════════════════════════════════════ */
#site-bg {
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(ellipse 110% 55% at 50% -8%,rgba(212,167,66,.14) 0%,transparent 65%),
    radial-gradient(ellipse 60% 50% at 95% 92%,rgba(212,60,40,.06) 0%,transparent 60%),
    #05050a;
}
.bg-grid {
  position:absolute; inset:0;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(212,167,66,.022) 60px),
    repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(212,167,66,.022) 60px);
}
.stars-wrap { position:absolute; inset:0 }
.star {
  position:absolute; border-radius:50%; background:#fff;
  animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s);
}
@keyframes twinkle {0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.85;transform:scale(1.5)}}

/* Floating gems */
.float-gem {
  position:absolute; font-size:var(--fs,22px); opacity:.065;
  animation:fg-drift var(--d,9s) ease-in-out infinite var(--dl,0s);
  pointer-events:none;
}
@keyframes fg-drift {0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-28px) rotate(18deg)}}

/* Anime character */
.char-wrap {
  position:absolute; bottom:0; right:2%; width:min(320px,50vw);
  opacity:.17; transform-origin:bottom center;
  animation:char-sway 5.5s ease-in-out infinite;
  filter:drop-shadow(0 0 26px rgba(212,167,66,.28)); pointer-events:none;
}
@keyframes char-sway {0%,100%{transform:translateY(0) rotate(-1deg)}33%{transform:translateY(-14px) rotate(1.4deg)}66%{transform:translateY(-7px) rotate(-.5deg)}}
.hair-g { animation:hair-sw 4s ease-in-out infinite }
@keyframes hair-sw {0%,100%{transform:skewX(0)}50%{transform:skewX(-2.5deg)}}
.arm-l-g { animation:arm-wv 2.8s ease-in-out infinite }
.arm-r-g { animation:arm-wv 2.8s ease-in-out infinite .4s }
@keyframes arm-wv {0%,100%{transform-origin:14% 8%;transform:rotate(0)}50%{transform-origin:14% 8%;transform:rotate(-13deg)}}
.gem-g { animation:gem-sh 2s ease-in-out infinite }
@keyframes gem-sh {0%,100%{filter:drop-shadow(0 0 5px #f5d98b)}50%{filter:drop-shadow(0 0 18px #f5d98b) drop-shadow(0 0 34px rgba(245,217,139,.5))}}

/* Glass overlay on top of bg */
#bg-glass { position:fixed; inset:0; z-index:1; background:rgba(5,5,14,.75); backdrop-filter:blur(3px) }

/* ═══════════════════════════════════════════════
   LOADER
═══════════════════════════════════════════════ */
#loader {
  position:fixed; inset:0; z-index:3000;
  background:var(--bg); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
  transition:opacity .6s, visibility .6s;
}
#loader.hide { opacity:0; visibility:hidden }
.ld-gem { font-size:58px; filter:drop-shadow(0 0 20px rgba(212,167,66,.7)); animation:gem-float 1.3s ease-in-out infinite }
@keyframes gem-float {0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ld-brand {
  font-family:'Cinzel Decorative',serif; font-size:13px; letter-spacing:.22em;
  background:linear-gradient(135deg,var(--gold-lt),var(--gold),var(--gold-dk));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.ld-bar { width:150px; height:2.5px; background:rgba(212,167,66,.1); border-radius:99px; overflow:hidden }
.ld-fill { height:100%; background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt)); animation:ld-run 1.5s ease forwards }
@keyframes ld-run {from{width:0}to{width:100%}}

/* ═══════════════════════════════════════════════
   ROOT LAYOUT
═══════════════════════════════════════════════ */
#root { position:relative; z-index:10; min-height:100dvh; display:flex; flex-direction:column }

/* ═══════════════════════════════════════════════
   TAB NAVIGATION
═══════════════════════════════════════════════ */
.tab-nav {
  position:sticky; top:0; z-index:50;
  background:rgba(5,5,14,.94); backdrop-filter:blur(22px);
  border-bottom:1px solid var(--c-dim); display:flex;
}
.tab-btn {
  flex:1; padding:11px 6px; font-size:11px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  transition:color .22s; display:flex; align-items:center; justify-content:center;
  gap:4px; position:relative;
}
.tab-btn.on { color:var(--gold) }
.tab-btn.on::after {
  content:''; position:absolute; bottom:0; left:12%; right:12%;
  height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); border-radius:99px;
}

/* ═══════════════════════════════════════════════
   STEP PROGRESS BAR
═══════════════════════════════════════════════ */
.step-bar {
  background:rgba(5,5,14,.88); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--c-dim); padding:10px 10px;
}
.steps { display:flex; align-items:center; justify-content:center; max-width:500px; margin:0 auto }
.step { display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; position:relative }
.step::after {
  content:''; position:absolute; top:13px; left:calc(50% + 14px);
  width:calc(100% - 28px); height:1.5px; background:var(--c-dim); transition:background .4s;
}
.step:last-child::after { display:none }
.step.done::after { background:var(--gold) }
.step-dot {
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; border:1.5px solid var(--muted); color:var(--muted);
  background:var(--bg2); transition:all .3s; z-index:1;
}
.step.active .step-dot { border-color:var(--gold); color:var(--gold); background:rgba(212,167,66,.1); box-shadow:0 0 12px var(--glow) }
.step.done .step-dot { border-color:var(--gold); background:var(--gold); color:#000 }
.step-lbl { font-size:8px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; font-weight:700; white-space:nowrap; transition:color .3s }
.step.active .step-lbl { color:var(--gold) }
.step.done .step-lbl { color:rgba(212,167,66,.6) }

/* ═══════════════════════════════════════════════
   PAGE SYSTEM
═══════════════════════════════════════════════ */
.page { display:none; flex:1 }
.page.on { display:block }

/* ═══════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════ */
.site-hdr { text-align:center; padding:26px 18px 20px; position:relative; z-index:10 }
.hdr-gem {
  font-size:50px; display:block;
  filter:drop-shadow(0 0 24px rgba(212,167,66,.7));
  animation:gem-float 3s ease-in-out infinite; margin-bottom:8px;
}
.hdr-brand {
  font-family:'Cinzel Decorative',serif; font-size:clamp(13px,4vw,24px); font-weight:900; letter-spacing:.05em;
  background:linear-gradient(135deg,var(--gold-lt),var(--gold) 45%,var(--gold-dk));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.hdr-tag { font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:.36em; text-transform:uppercase; color:var(--gold); opacity:.7; margin-top:4px }
.hdr-chips { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:13px }
.chip {
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(212,167,66,.07); border:1px solid var(--c-border);
  border-radius:99px; padding:5px 13px; font-size:10.5px; color:var(--gold-lt);
  backdrop-filter:blur(8px); transition:background .2s, box-shadow .2s;
}
.chip:hover,.chip:active { background:rgba(212,167,66,.16); box-shadow:0 0 14px rgba(212,167,66,.2) }

/* ═══════════════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════════════ */
.main-wrap { position:relative; z-index:10; max-width:500px; margin:0 auto; padding:18px 13px 110px }

.sec-hd {
  font-family:'Cinzel',serif; font-size:9px; letter-spacing:.3em; text-transform:uppercase;
  color:var(--gold); opacity:.82; display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.sec-hd::before,.sec-hd::after {
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,167,66,.4),transparent);
}

/* ═══════════════════════════════════════════════
   PACK GRID  (2-column, glassmorphism cards)
═══════════════════════════════════════════════ */
.pack-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:20px }

.pack-card {
  background:var(--glass); border:1.5px solid var(--c-dim); border-radius:var(--r);
  padding:14px 12px 13px; cursor:pointer; position:relative; overflow:hidden;
  backdrop-filter:blur(12px); -webkit-user-select:none; user-select:none;
  transition:border-color .22s, transform .15s, box-shadow .22s, background .22s;
}
.pack-card::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(212,167,66,.1),transparent 65%); opacity:0; transition:opacity .22s;
}
.pack-card:hover { border-color:rgba(212,167,66,.45); transform:translateY(-2px); box-shadow:0 6px 22px rgba(212,167,66,.1) }
.pack-card:hover::before { opacity:1 }
.pack-card.active {
  border-color:var(--gold); background:rgba(212,167,66,.11);
  box-shadow:0 0 0 1.5px var(--gold), 0 6px 30px rgba(212,167,66,.25), 0 0 20px rgba(212,167,66,.1);
}
.pack-card.active::before { opacity:1 }
.pack-badge {
  position:absolute; top:7px; right:7px; background:var(--gold); color:#000;
  font-size:7.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 6px; border-radius:99px;
}
.pack-ico { font-size:20px; display:block; margin-bottom:4px }
.pack-nm { font-family:'Cinzel',serif; font-size:11.5px; font-weight:700; color:var(--gold-lt); margin-bottom:2px }
.pack-pr { font-size:17px; font-weight:800; color:#fff }
.pack-chk {
  position:absolute; bottom:7px; right:7px; width:18px; height:18px; border-radius:50%;
  background:var(--gold); color:#000; font-size:9.5px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(0); transition:all .22s cubic-bezier(.34,1.56,.64,1);
}
.pack-card.active .pack-chk { opacity:1; transform:scale(1) }

/* ═══════════════════════════════════════════════
   QUANTITY SELECTOR
═══════════════════════════════════════════════ */
.qty-block {
  background:var(--glass); border:1px solid var(--c-dim); border-radius:16px;
  padding:16px 15px; margin-bottom:16px; backdrop-filter:blur(12px);
}
.qty-hd { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); opacity:.85; margin-bottom:12px; display:flex; align-items:center; gap:7px }
.qty-hd small { font-weight:400; color:var(--muted); font-size:9.5px }
.qty-row { display:flex; align-items:center; justify-content:space-between; gap:10px }
.qty-info { flex:1 }
.qty-nm { font-size:14px; font-weight:700; color:#fff; margin-bottom:2px }
.qty-sub { font-size:11px; color:var(--muted) }
.qty-ctrl { display:flex; align-items:center; background:rgba(5,5,14,.8); border-radius:12px; border:1px solid var(--c-dim); overflow:hidden }
.q-btn { width:42px; height:42px; color:var(--gold-lt); font-size:22px; font-weight:300; display:flex; align-items:center; justify-content:center; transition:background .18s; -webkit-user-select:none; user-select:none }
.q-btn:hover,.q-btn:active { background:rgba(212,167,66,.16) }
.q-num { width:44px; height:42px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#fff; border-left:1px solid var(--c-dim); border-right:1px solid var(--c-dim) }
.qty-totals { display:flex; justify-content:space-between; align-items:flex-end; margin-top:14px; padding-top:12px; border-top:1px solid var(--c-dim) }
.qt-l .qt-lbl,.qt-r .qt-lbl { font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px }
.qt-l .qt-val { font-size:17px; font-weight:800; color:var(--gold-lt) }
.qt-r { text-align:right }
.qt-r .qt-val { font-size:22px; font-weight:900; color:var(--gold-lt) }

/* ═══════════════════════════════════════════════
   FORM CARD
═══════════════════════════════════════════════ */
.form-card { background:var(--glass); border:1px solid var(--c-dim); border-radius:18px; padding:20px 16px; backdrop-filter:blur(12px) }
.fld { margin-bottom:14px }
.fld:last-child { margin-bottom:0 }
.fld-lbl { display:block; font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); opacity:.85; margin-bottom:6px }
.fld-inp {
  width:100%; background:rgba(5,5,14,.78); border:1.5px solid var(--c-dim);
  border-radius:10px; padding:12px 14px; font-size:15px; color:var(--text); outline:none;
  backdrop-filter:blur(6px); transition:border-color .2s, box-shadow .2s;
}
.fld-inp::placeholder { color:var(--muted) }
.fld-inp:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,167,66,.14) }
.fld-inp.ok { border-color:rgba(34,197,94,.55) }
.fld-inp.bad { border-color:rgba(239,68,68,.5) }
.fld-hint { font-size:11px; margin-top:4px; align-items:center; gap:4px; display:none }
.fld-hint.ok { color:var(--green); display:flex }
.fld-hint.err { color:var(--red); display:flex }

.pack-disp {
  background:rgba(5,5,14,.7); border:1.5px dashed var(--c-dim);
  border-radius:10px; padding:11px 14px; display:flex; align-items:center;
  gap:8px; font-size:14px; min-height:46px; color:var(--muted); transition:all .3s;
}
.pack-disp.has { border-style:solid; border-color:var(--c-border); color:var(--gold-lt); font-weight:600 }

/* PAY NOW BUTTON */
.btn-pay {
  width:100%; border-radius:12px; padding:15px;
  font-family:'Cinzel',serif; font-size:14px; font-weight:700; letter-spacing:.12em; color:#000;
  background:linear-gradient(135deg,var(--gold-dk),var(--gold) 50%,var(--gold-lt));
  box-shadow:0 4px 22px rgba(212,167,66,.35);
  transition:opacity .2s, transform .15s, box-shadow .22s; position:relative; overflow:hidden;
}
.btn-pay::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.22),transparent); opacity:0; transition:opacity .2s }
.btn-pay:hover:not(:disabled)::after { opacity:1 }
.btn-pay:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 34px rgba(212,167,66,.55) }
.btn-pay:disabled { opacity:.28; cursor:not-allowed; filter:grayscale(.5) }

.trust-strip { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:14px }
.trust-item { font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:4px }
.trust-item em { color:var(--gold); font-style:normal }

/* ═══════════════════════════════════════════════
   OVERLAY / BOTTOM SHEET SYSTEM
═══════════════════════════════════════════════ */
.overlay {
  position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.88);
  backdrop-filter:blur(10px); display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.overlay.on { opacity:1; pointer-events:all }
.sheet {
  width:100%; max-width:480px; max-height:94dvh; overflow-y:auto;
  border-radius:22px 22px 0 0;
  box-shadow:0 -16px 60px rgba(0,0,0,.9), 0 0 0 1px rgba(212,167,66,.18);
  transform:translateY(100%); transition:transform .4s cubic-bezier(.22,1,.36,1);
  overscroll-behavior:contain;
}
.overlay.on .sheet { transform:translateY(0) }
.overlay.ctr { align-items:center; padding:14px }
.overlay.ctr .sheet { border-radius:20px; max-height:92dvh }

/* ═══════════════════════════════════════════════
   PAYMENT SHEET LAYOUT
═══════════════════════════════════════════════ */
.pay-hdr {
  background:#090910; padding:15px 18px 13px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.05); position:sticky; top:0; z-index:10;
}
.pay-ttl { font-family:'Cinzel',serif; font-size:14px; font-weight:700; color:#fff }
.pay-sub { font-size:10.5px; color:var(--muted); margin-top:1px }
.x-btn {
  width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.07);
  color:var(--text); font-size:15px; display:flex; align-items:center; justify-content:center; transition:background .2s;
}
.x-btn:hover { background:rgba(255,255,255,.15) }

.pay-body { background:#fff; padding:0 }

/* Blue order banner */
.ord-banner {
  background:linear-gradient(135deg,#0f1b42,#0d2055);
  padding:15px 20px; display:flex; align-items:center; justify-content:space-between;
}
.ob-l .ob-lbl,.ob-r .ob-lbl { font-size:9.5px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.09em; margin-bottom:3px }
.ob-l .ob-val { font-size:14px; font-weight:800; color:#fff }
.ob-r { text-align:right }
.ob-r .ob-val { font-size:28px; font-weight:900; color:#fff; letter-spacing:-.02em }

/* Timer strip */
.tmr-strip { background:#f4f6ff; border-bottom:1px solid #ebeef5; padding:9px 20px; display:flex; align-items:center; justify-content:space-between }
.tmr-lbl { font-size:11px; color:#777; display:flex; align-items:center; gap:5px }
.tmr-val { font-size:20px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--blue); transition:color .3s }
.tmr-val.urgent { color:var(--red); animation:blink 1s ease-in-out infinite }
.tmr-val.done { color:var(--red) }
@keyframes blink {0%,100%{opacity:1}50%{opacity:.5}}

/* ═══════════════════════════════════════════════
   PREMIUM QR CARD  (html2canvas target)
═══════════════════════════════════════════════ */
.qr-section { padding:20px 18px 14px; border-bottom:1px solid #f0f0f0; display:flex; flex-direction:column; align-items:center; gap:14px }

#qrDlCard { width:100%; max-width:290px; border-radius:20px; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06) }
.qc-top {
  background:linear-gradient(135deg,#b8880a,#d4a742 40%,#f5d98b 60%,#d4a742 80%,#9a7320);
  padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
}
.qc-brand { font-family:'Cinzel Decorative',serif; font-size:9.5px; font-weight:900; color:#3a2800; letter-spacing:.06em }
.qc-upi-pill { font-size:8px; font-weight:800; letter-spacing:.1em; color:#5a3a00; background:rgba(255,255,255,.32); padding:2px 8px; border-radius:99px }
.qc-body { background:#fff; padding:14px 14px 10px; display:flex; flex-direction:column; align-items:center; gap:9px }
.qr-canvas { position:relative; width:185px; height:185px }
.qr-canvas img { width:100%; height:100%; border-radius:7px; display:block }
.qr-logo {
  position:absolute;
